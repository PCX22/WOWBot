# Instancias de vanilla. Si Blizzard añade contenido a WoW Forever, se añade aquí.
# tamano: jugadores. composicion: plazas por rol; si falta, se usa la de su tamaño.
composiciones:
  5:  { tanque: 1, sanador: 1, dps: 3 }
  10: { tanque: 2, sanador: 3, dps: 5 }
  20: { tanque: 2, sanador: 5, dps: 13 }
  40: { tanque: 4, sanador: 10, dps: 26 }

